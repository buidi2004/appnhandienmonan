services:
  - type: web
    name: appnhandienmonan
    env: python
    # Vì backend nằm trong thư mục con nên ta cần build và chạy từ đó
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Nhập tay trên Dashboard Render
      - key: FIREBASE_CONFIG_JSON
        sync: false # Nhập tay nội dung serviceAccountKey.json lên Dashboard
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
    autoDeploy: true
